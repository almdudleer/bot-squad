# T-0121: CI hook for the backlog status-schema lint.
#
# This is a syntax-only sanity check — the live data tree
# (/home/www/bot-squad/data) is not present on GitHub runners, so the lint
# runs against the in-repo synthetic fixtures via pytest. The actual data
# tree is policed by the pre-commit framework (see .pre-commit-config.yaml)
# when operators opt in locally, and by the API PATCH validator at write
# time (api/app/routes_backlog.py::_VALID_STATUSES).
name: lint

on:
  push:
    branches: [master, bot_squad/dev]
  pull_request:

jobs:
  backlog-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke-run the lint scripts (empty default root → exit 0)
        run: |
          python3 scripts/lint/backlog_frontmatter.py /nonexistent
          python3 scripts/lint/backlog_ids.py /nonexistent
          python3 scripts/lint/backlog_provenance.py /nonexistent
          python3 scripts/lint/backlog_priority.py /nonexistent
      - name: Cross-module attribute smoke (T-0186 absorption-split gate)
        # Stdlib-only AST check — proves every cfg.<attr> access in a consumer
        # resolves to a real Config member. Catches a wide-add split that ships
        # actions.py without its config.py field BEFORE deploy (origin build).
        run: |
          python3 scripts/lint/cross_module_attr_smoke.py
      - name: Duplicated-module mirror gate (T-0738 / T-0743)
        # Stdlib-only: imports MIRRORS + mirror_failure() from the mirror TEST
        # (the SSOT of both the pair list and the comparison) and calls them, so
        # this gate and that test can never disagree. Wired because T-0733
        # pushed a divergence in 5fe547f with this workflow green — the guard
        # was correct and silent, since nothing but a hand-run of the full
        # worker suite ever executed it. T-0743 generalised it from task_body
        # alone to every duplicated-by-design pair (frontmatter, secret_crypto,
        # idalloc, initiative_resolver, task_search), whose own hand-rolled
        # checks lived in the same never-run worker suite.
        run: |
          python3 scripts/lint/module_mirrors.py --list
          python3 scripts/lint/module_mirrors.py
      - name: Role-contract pointers name the git SSOT (T-0716 / D-0043)
        # Repo-source scan (no data tree): fails if any prose sends a reader to
        # the drifting per-project vision/roles/<role>.md copy.
        run: |
          python3 scripts/lint/role_doc_pointers.py
      - name: No duplicate top-level def/class in scripts/cli/bsq (T-1017)
        # Stdlib-only AST census (tree.body only, never ast.walk — see the
        # script's docstring for the traversal bug that distinction exists to
        # avoid). scripts/cli/bsq is a live file every bot-squad session in a
        # shared clone can edit; the real enforcement point for a LOCAL commit
        # is the .githooks/pre-commit gate (gate 3, commit-policy.sh) which
        # censuses the STAGED blob before it ever reaches this workflow — this
        # step is defense in depth for anything that reaches origin without
        # going through that hook (e.g. --no-verify, or a push from a clone
        # that never installed core.hooksPath).
        run: |
          python3 scripts/lint/duplicate_def_census.py -v scripts/cli/bsq
      - name: Install api test deps
        run: |
          pip install --upgrade pip
          pip install -e api[dev]
      - name: No undefined names in the test trees (T-0789)
        # ~1s pyflakes scan of worker/tests + api/tests + scripts, filtered to
        # the undefined-name family. It is HERE, on every push, because an
        # undefined name in a test never fails loudly: T-0789 found one sitting
        # behind an importorskip that lifted nowhere, and a second one whose
        # NameError _send_stakeholder_dm caught as the very TG failure the test
        # was simulating — so the test was green BECAUSE of the bug in itself.
        # Running the suite cannot find either. Measured at 28abd2a: 4 hits,
        # both defects, no false positives (the 71 unused-import/unused-local
        # findings are deliberately not in scope — see the script's docstring).
        # pyflakes arrives with api[dev] installed above.
        run: |
          python3 scripts/lint/undefined_names.py
      - name: Run lint script unit tests
        run: |
          cd api && pytest tests/test_backlog_frontmatter_lint.py tests/test_backlog_ids_lint.py tests/test_backlog_provenance_lint.py tests/test_role_doc_pointers_lint.py tests/test_undefined_names_lint.py tests/test_duplicate_def_census_lint.py -x -q
      - name: Worker /api paths resolve against the mounted routes (T-0775)
        # Cross-directory invariant: it reads worker/ source and builds the api
        # app, so it needs BOTH trees — which is exactly why it lives here and
        # not only in the nightly. Under the api-only docker mount used on the
        # dev host it SKIPS (worker/ is not in that mount); this job has the
        # whole checkout, so this is where it actually runs on every push.
        # T-0775 shipped three prompt strings naming /api/conversations/...,
        # mounted nowhere, while the role contract named the right route — a
        # divergence no import and no type check can see.
        run: |
          cd api && pytest tests/test_worker_api_paths_mounted.py -x -q
      - name: bsq and the worker derive the same role from a window (T-0778)
        # Third cross-directory invariant in this job, same reason as the two
        # above: it loads `scripts/cli/bsq` AND `worker/…/sessions.py`, so it
        # needs the whole checkout. It also lives in `worker/tests/`, which the
        # NIGHTLY runs and this workflow does not — and T-0738's lesson is that
        # a guard only the nightly runs leaves a divergence live for hours.
        #
        # No `pip install -e worker` needed: the `bot_squad_worker.sessions`
        # import chain and `worker/tests/conftest.py` are both stdlib-clean, so
        # PYTHONPATH plus the api[dev] pytest installed above is enough
        # (measured — this exact invocation passes 66 + 1 skipped).
        #
        # bsq's `_role_from_sid` claimed in its docstring to mirror
        # `sessions._derive_role` and had silently stopped: prod-TL windows got
        # teamlead.md and qa windows got dev.md, with no error anywhere.
        run: |
          cd worker && PYTHONPATH=. pytest tests/test_bsq_role_derivation_mirror.py -x -q
      - name: The api reads the worker's stores the way the worker writes them (T-0749)
        # Fourth cross-directory invariant, same reason as the three above: it
        # writes fixtures with `worker/…/tg_bindings.py` + `conversation_locus.py`
        # and reads them back through the api's `_resolve_relay_target`, so it
        # needs BOTH trees. Under the dev host's api-only docker mount it SKIPS,
        # and a skip is not coverage — this job has the whole checkout, so this
        # is where it runs.
        #
        # No PYTHONPATH: both worker store modules are stdlib-clean and the
        # worker package's `__init__.py` is empty, so the test file puts
        # `worker/` on sys.path itself.
        #
        # T-0740 found the api discarding a `thread_id` it had been handed and
        # relaying a session's reply into the stakeholder's private DM instead
        # of the topic — while still reporting `relayed: true`. The api's copies
        # of `tg_bindings._key` / `conversation_locus._key` are hand-written, and
        # T-0676 had already moved that format once. MEASURED: with the worker's
        # binding key changed to a different separator, the whole existing
        # T-0740 suite stays green (66/66) because it seeds the stores by hand;
        # this file goes red. See D-0065 for why the two LADDERS are not
        # comparable and this layer is.
        run: |
          cd api && pytest tests/test_relay_destination_differential.py -x -q
      - name: The three drive-mode mirrors agree — worker / api / bsq (T-0828)
        # Sixth cross-directory invariant, same reason as the five above: it
        # drives `worker/…/pace.py`, `api/app/routes_transparency.py` AND
        # `scripts/cli/bsq` over one fixture table, so it needs the whole
        # checkout. Under the dev host's api-only docker mount it SKIPS, and a
        # skip is not coverage — this job has the whole checkout, so this is
        # where it runs.
        #
        # D-0069 put the standing drive mode in the existing pace.json. Three
        # processes read that file and none may import the others (systemd
        # worker / docker api / stdlib-only CLI), so the normalisation exists
        # three times by design. If they drift the failure is SILENT and it is
        # the stakeholder's own reported defect: the UI shows a project with no
        # drive mode set while `bsq pace show` says one is. T-0778's rule is
        # that a hand-maintained copy is allowed only when a test pins it.
        #
        # ⚠ It compares NORMALISATION, not RENDERING — all three can normalise
        # identically and still print contradictory sentences to the human. The
        # rendering rule is pinned per surface
        # (worker/tests/test_pace_drive_cli_render.py and the driveMode vitest);
        # do not read this step's green as "the surfaces agree".
        run: |
          cd api && pytest tests/test_pace_drive_mirror.py -x -q
      - name: The api's PATCH preserves the worker's session-history ts map (T-0789)
        # Fifth cross-directory invariant, and the same failure class as the
        # T-0749 step above: the api writing a file whose format the worker owns.
        # `merge_task_update` must copy `session_history_ts` — an
        # existing-but-unlisted frontmatter key holding each SID's first-touch
        # timestamp — through an operator PATCH verbatim. Drop it and every
        # session's first-touch time on that task is silently gone; no import
        # and no type check sees it.
        #
        # The test lives in worker/tests/test_sessions.py and guards itself with
        # `pytest.importorskip("app.markdown_writer")`, because a worker-only
        # venv cannot import the api. T-0789 MEASURED where that skip lifted:
        # nowhere. Not the worker venv run (it is one of the 3 skips every dev
        # reports), not this job before now (it ran only named files), not the
        # nightly (worker[dev] only, so `app` is not importable there either,
        # and it is inert per T-0738), not a verify-isolated extract.
        #
        # BOT_SQUAD_REQUIRE_CROSS_TREE=1 turns that skip into a hard ImportError
        # here, so this step cannot go quietly uncovered the way the test did:
        # if `app` ever stops being importable in this job the step goes RED
        # rather than green-with-a-skip. `-rs` prints the reason for any skip.
        run: |
          cd worker && PYTHONPATH=. BOT_SQUAD_REQUIRE_CROSS_TREE=1 pytest \
            "tests/test_sessions.py::test_session_history_ts_preserved_on_api_patch_roundtrip" -x -q -rs
      - name: The priority WRITER and the priority READER share one vocabulary (T-0877)
        # The defect this pins was not in either half. `bsq task new --priority`
        # stored any string ("priority value, verbatim"); pickup's ranking read
        # only p1/p2/p3; and NOTHING compared the two. So `--priority high`
        # exited 0 on a ticket the board could never surface again — 86 of them
        # on the watchrobot board, its whole needs-triage band there for the
        # FORMAT of one field, the oldest invisible 20.6 days (T-0586).
        #
        # It runs HERE, on every push, and not only in the nightly worker suite,
        # for T-0738's reason: a guard nothing runs is not a guard. The test is
        # stdlib-clean at import (bot_squad_worker.pickup/priority pull nothing
        # in), so PYTHONPATH plus the api[dev] pytest installed above is enough.
        #
        # `-k` deliberately selects the cross-gate invariant and the pinned
        # word→band table only: the rest of the file drives task_new through a
        # Config fixture, which is the nightly's job. This step answers ONE
        # question — can the writer accept a value the reader cannot rank.
        run: |
          cd worker && PYTHONPATH=. pytest tests/test_priority_vocabulary.py \
            -k "reader_can_rank or words_the_board or one_rung" -x -q
