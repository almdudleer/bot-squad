# T-0738 tier 3: run the FULL suites once a night, unfiltered.
#
# Why nightly and not per-push
# ----------------------------
# T-0736's task_body divergence shipped in 5fe547f and survived until a session
# happened to run the worker suite by hand, hours later, on an unrelated ticket.
# The fix for that is a bounded detection window, not necessarily an instant
# one. Per-push these two suites cost ~7k billed Actions minutes/month (the repo
# is private, so minutes are billed and rounded up per job per run); nightly
# costs ~330. Nightly caps the "a break lived undetected" window at <24h for
# EVERY test in the repo at roughly 5% of the per-push price. The cheap
# invariant gates that belong on every push are in `lint`, and the web suite —
# 557 tests in under 3s — is per-push in `web-tests`.
#
# Web is repeated here deliberately: `web-tests` is path-filtered to web/**, so
# a worker or api change that breaks the frontend is invisible to it. Nightly is
# the unfiltered pass, and 3 seconds is not worth optimising away.
#
# !! THIS WORKFLOW CANNOT FIRE UNTIL IT EXISTS ON `master` !!
# GitHub runs `schedule:` and `workflow_dispatch:` only from the copy of the
# workflow on the repository's DEFAULT branch, which is `master`. `master` is
# currently 620 commits behind `bot_squad/dev` and carries no `.github/`
# directory at all, so committing this on the dev branch is necessary but NOT
# sufficient — it will sit here silently doing nothing, which is exactly the
# false-confidence failure T-0738 is about. Someone with push rights must
# cherry-pick this file onto `master` (or the default branch must be changed).
# Until then, treat the nightly as NOT RUNNING. `push:`-triggered workflows
# (`lint`, `web-tests`) are unaffected — those use the file from the pushed ref,
# which is why `lint` works from `bot_squad/dev` today.
#
# Every command below was verified green from a clean checkout in a container
# before being wired (T-0738, 2026-07-27): worker 2466 passed / 114s,
# api 1149 passed / 294s, web 557 passed / 3s.
name: nightly-suites

on:
  schedule:
    # 02:30 UTC. Off the hour on purpose — GitHub delays scheduled runs that
    # pile up on :00.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Schedules run from master; the work happens on bot_squad/dev, so
          # test that branch explicitly rather than 620-commits-stale master.
          ref: bot_squad/dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools the suite shells out to
        # Measured, not guessed: without these the suite reports 216 failed /
        # 151 errors, and every one is a FileNotFoundError for one of these
        # three binaries. git and rsync are on the runner image already; tmux is
        # installed explicitly rather than assumed.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux rsync git
      - name: Install the worker package + test deps
        run: |
          pip install --upgrade pip
          pip install -e worker[dev]
      - name: Run the worker suite
        run: |
          pytest worker/tests -q

      # T-0774: the same suite again with the FILE ORDER REVERSED. Not
      # redundant — on 99cb674 the forward run was 2793 passed and the reverse
      # run was 5 failed, at the same commit, because `outbound_log.DROPS` is
      # process-global and `tests/test_tg.py` leaked 17 into it as a side effect
      # of exercising the transport. The plain run above was green THROUGHOUT
      # and could never have caught it: alphabetically the victim
      # (test_outbound_liveness.py) ran first, so the leak landed behind it.
      # CI was safe by that same accident, and anyone who parallelises or
      # randomises the step above would have tripped it on their first run and
      # reasonably blamed their own change.
      #
      # A second step in the SAME job, not a second job: the checkout and the
      # install are already paid for, so this costs ~2 minutes of a 30-minute
      # budget and no extra billed job.
      #
      # `tests/test_drops_isolation.py` pins the specific leak in ~1s in any
      # order; this step is the wider net, for the next order-dependence that
      # nobody has found yet. If it goes red while the forward run is green,
      # that is what it has caught — look for shared process-global state, not
      # for a bug in the tests that failed.
      - name: Run the worker suite again, in REVERSE file order
        run: |
          cd worker && pytest -q $(ls tests/test_*.py | tac)

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot_squad/dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the api package + test deps
        # NOTE (T-0738): the project convention that "api tests run inside the
        # bot-squad-api docker image" is a HOST convention — the host has no api
        # venv. It does not apply to CI, and the image recipe cannot run the
        # whole suite anyway (its api/-only mount 4-errors at collection on the
        # tests that reach for scripts/). A plain editable install at the repo
        # root passes 1149/1149.
        run: |
          pip install --upgrade pip
          pip install -e api[dev]
      - name: Run the api suite
        # BUILD_AT_IMPORT=0 keeps `from app.main import build_app` from calling
        # build_app() at import time, which explodes before pytest can collect.
        env:
          BUILD_AT_IMPORT: "0"
        run: |
          cd api && pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot_squad/dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned deps
        working-directory: web
        run: npm ci
      - name: Run the web suite (vitest)
        working-directory: web
        run: npm test

  # T-0991: the FOURTH surface. `scripts/cli` holds the tests for `bsq` itself
  # — the CLI every session in the fleet drives all day — and until this job
  # existed NOTHING collected them: not this workflow, not `lint` (which runs
  # named lint-script unit tests out of `api/tests`), not the worker or api
  # arms (`testpaths = ["tests"]` in both pyproject.toml files is the whole
  # mechanism), not a `verify-isolated` extract. T-0982 found it while asking
  # its scope-4 question — "which DECLARED entrypoints does any certification
  # actually EXECUTE?" — and measured 486 tests sitting outside every answer.
  #
  # MEASURED before wiring (T-0991, 2026-09-07, at 197e0b8):
  #   `bsq verify-isolated --with-git` clone : 596 passed, 0 skipped, 87.5s
  #   frozen `git archive` extract           : 590 passed, 3 failed, 3 skipped
  #
  # ⚠ THE EXTRACT ARM CANNOT CERTIFY THIS SURFACE, and that is why this job
  # uses a plain checkout. All six differences above have ONE cause: a
  # `git archive` extract carries no `.git`, and `scripts/cli` is git-dependent
  # (33 sites shell out to `git`). The 3 skips self-declare; the 3 failures in
  # test_t1027_build_api_namespace.py do not — `bsq._repo_root()` dies "not
  # inside a git repo" and they read as ordinary red. Neither is a defect in
  # the code. A GitHub checkout is a real repo, so the surface runs whole here.
  #
  # DEPS ARE MEASURED, NOT ASSUMED: the imports are stdlib + pytest, which is
  # what the files look like — but running them in a pytest-only venv gives
  # 27 failed / 569 passed, every one a `ModuleNotFoundError: No module named
  # 'yaml'` from a transitive read of the backlog frontmatter. pytest+pyyaml
  # is 596/596. No editable install of worker/ or api/ is needed; nothing in
  # scripts/cli imports `bot_squad_worker` or `app`.
  #
  # `git` is on the runner image. The 10 `docker` call sites are stubbed by
  # fixtures and never reach a daemon.
  #
  # THE JOB NAME `scripts-cli` IS LOAD-BEARING:
  # worker/tests/test_certification_surface_census.py asserts this job exists
  # and that a step here still names `scripts/cli`. Renaming or deleting it
  # turns that census RED rather than quietly un-certifying the surface again
  # — which is the entire lesson of T-0764/T-0982, where a correct two-ended
  # forcing function shipped a regression through both ends because nobody
  # executed either one.
  scripts-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot_squad/dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the measured deps
        run: |
          pip install --upgrade pip
          pip install pytest "pyyaml>=6"
      - name: Run the scripts/cli suite
        run: |
          pytest -q scripts/cli
