# T-0121: lint backlog md frontmatter against the canonical status schema
# (planned/open/in_progress/totest/reopened/closed). The source-of-truth is
# api/app/routes_backlog.py::_VALID_STATUSES; this hook catches direct-file
# edits that bypass the API PATCH validator.
#
# Local installation (operator opt-in, not enforced):
#     pip install pre-commit && pre-commit install
#
# Direct invocation (no framework required):
#     python3 scripts/lint/backlog_frontmatter.py [DATA_DIR ...]
repos:
  - repo: local
    hooks:
      - id: backlog-frontmatter-schema
        name: backlog frontmatter status schema
        entry: python3 scripts/lint/backlog_frontmatter.py
        language: system
        # Runs on every invocation; defaults to the install data dir
        # (/home/www/bot-squad/data) when no arg is given. No file filter —
        # the script walks the data tree itself.
        pass_filenames: false
        always_run: true
      # T-0207: catch a ticket whose id was hand-picked (out-of-band write that
      # skipped the flock'd allocator) — the operator dispatch-templating
      # collision this ticket closes. Flags id-above-counter, duplicate ids,
      # and filename/frontmatter id mismatch. SSOT for minting is the allocator
      # (worker task_new / api routes_backlog -> idalloc.allocate_id).
      - id: backlog-ids-allocator
        name: backlog ticket ids from allocator (no out-of-band)
        entry: python3 scripts/lint/backlog_ids.py
        language: system
        pass_filenames: false
        always_run: true
      # T-0301: every NEW ticket (created on/after the cutoff, default 2026-06-21,
      # override BOT_SQUAD_PROVENANCE_CUTOFF) must cite a source via a provenance:
      # field (corpus:<token> | F-NNNN | T-NNNN | stakeholder:YYYY-MM-DD). Forward-
      # only: the pre-cutoff backlog is grandfathered. See docs/roadmap/provenance.md.
      - id: backlog-provenance
        name: backlog ticket provenance (new tickets cite a source)
        entry: python3 scripts/lint/backlog_provenance.py
        language: system
        pass_filenames: false
        always_run: true
      # T-0716: a role-contract pointer must name the git SSOT
      # (api/app/resources/roles/<role>.md), never the per-project
      # data/<slug>/vision/roles/ copy — seeded once at scaffold, display-only,
      # and it DRIFTS (D-0043). Reads repo sources only, no data tree.
      - id: role-doc-pointers
        name: role-contract pointers name the git SSOT (not vision/roles/)
        entry: python3 scripts/lint/role_doc_pointers.py
        language: system
        pass_filenames: false
        always_run: true
