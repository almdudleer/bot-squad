[project]
name = "bot-squad-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "bcrypt>=5",
    # T-0179: Fernet at-rest encryption for secrets.toml values. Used by the
    # shared secret_crypto.py (mirrored to worker/bot_squad_worker/) that
    # routes_settings calls to encrypt the TG bot token on write.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # T-0789: the undefined-name gate (scripts/lint/undefined_names.py) and its
    # unit test. Lives in api's dev extra because the lint CI job already does
    # `pip install -e api[dev]` — no second install step — and NOT in the shared
    # worker venv, which agents must not mutate.
    "pyflakes>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
