# api/requirements.lock — T-1004
#
# THE IMAGE IS OTHERWISE NOT A FUNCTION OF THE REF. api/pyproject.toml declares
# 13 dependency specs and every one is a `>=` floor, so two builds of the SAME
# commit on two days resolve whatever PyPI serves each day. That is not
# theoretical: on 2026-09-06 the install ran fastapi 0.136.1 while an image
# under test had 0.141.1, and an api suite result had already been observed to
# change because a test split MOVED between fastapi versions — a count
# difference with no commit behind it.
#
# EVERY VERSION HERE WAS MEASURED, NOT RESOLVED. It is `pip freeze` taken inside
# the RUNNING api container at 2026-09-06T19:47Z — image
# sha256:ed6e988565481254409d0d1cc8238e24d29e01f58465baa45c7b4ad8d9e4b17f, built
# 17:51:32Z from 760c0fe29136, container started 17:53:41Z. So this pin selects
# the set this box was already serving on and that today's api certifications
# were taken against: it is behaviour-preserving BY CONSTRUCTION rather than by
# hope, and a version bump becomes a separate, visible, one-line change.
#
# api/Dockerfile installs from THIS FILE and then FAILS THE BUILD if the
# resulting environment differs from it. The lock is a control, not a record.
#
# Regenerate deliberately, never as a side effect:
#     docker run --rm --entrypoint python bot-squad-api:latest -m pip freeze \
#       | grep -E '^[A-Za-z0-9_.-]+==' | sort -f > api/requirements.lock
# (and re-run the api suite, because that is the change you just made)
#
# ⚠ WHAT THIS FILE DOES NOT PIN, so nobody reads it as more than it is:
#   · apt-get build-essential/git in api/Dockerfile — unpinned, named residual.
#   · CI's `pip install -e api[dev]` (.github/workflows) still resolves floors.
#   · No hashes. PyPI versions are immutable in practice, so `==` is sufficient
#     for reproducibility but NOT for supply-chain integrity; --require-hashes
#     is the next step, not this one.
