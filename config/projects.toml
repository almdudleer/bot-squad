# bot-squad project registry. Add a new project via:
#   scripts/cli/bot-squad project init <slug> --repo <path>

[projects.watchrobot]
slug          = "watchrobot"
display_name  = "Watchrobot"
# T-0680 (stakeholder 2026-07-25: "rename topics from [watchrobot] to WR"):
# short abbreviation used in TG topic names, [<topic_abbrev>] instead of the
# full slug. Only touches topic naming — slug/display_name are unchanged.
topic_abbrev  = "WR"
# T-0189 (stakeholder 2026-06-02, "it's all watchrobot now"): the bot-squad
# project SLUG is now `watchrobot`, matching the public brand (repo, home dir,
# staging domain). This SUPERSEDES the 2026-05-19 decision to keep the slug
# `signal-tracker` while only the home dir carried the brand — the data dir
# moved data/signal-tracker → data/watchrobot and a ~30-day /p/signal-tracker
# redirect covers stale links (App.tsx). The DEPLOY INFRA below is deliberately
# RETAINED as-is: prod/staging/dev URLs (signal-*.dev.uzinvestapi.com) and the
# docker service/container names (signal-tracker-staging in deploy/staging.sh)
# point at watchrobot's real running deployment — renaming those is a separate
# external-infra task, NOT T-0189.
# Dev clone: where agents work. On the deploy_branch (bot_squad/dev), pushes
# to staging on every deploy queue.
repo_path     = "/home/almdudleer/watchrobot/dev"
# Master clone: separate working tree on master branch for prod deploys,
# hotfixes, and rollbacks. The dev clone is never touched for these so the
# agent team can keep working uninterrupted.
repo_master   = "/home/almdudleer/watchrobot/master"
# Deploy clone (T-0143/T-0225): local CI/CD checkout for the STAGING target,
# parallel to dev/master. The deploy worker creates it on first deploy and
# force-syncs it to origin/bot_squad/dev each run, so the SHARED dev clone's
# dirty tree / unpushed commits no longer gate watchrobot's staging deploy —
# the recipe builds from the latest PUSHED commit. This removes the multi-team
# head-of-line block (one team's WIP on the shared clone deferring all teams'
# deploys). No agent ever edits here. (prod still deploys in-place from the
# master clone above, which keeps the destroy-guard on unpushed commits.)
repo_deploy   = "/home/almdudleer/watchrobot/deploy"
deploy_branch = "bot_squad/dev"
master_branch = "master"
# RETAINED (external infra — see note above): real deployment URLs. These
# are the recipe/smoke-test URLs (prod.sh polls prod_url's /api/version) and
# stay pinned to the .uzinvestapi.com hosts the deploy tooling has always
# used. T-0201 (2026-07-06): the REAL prod host is a single `signal-tracker`
# container, traefik-routed, that answers on FOUR hostnames — this alias
# plus watchrobot.${DOMAIN}, terminal.nolim.finance (full app), and
# watchrobot.nolim.finance (news-only render) — see docker-compose.yml's
# traefik router rule for signal-tracker. There is no separate prod host per
# vanity domain; they're all the same container/deploy.
prod_url      = "https://signal-tracker.dev.uzinvestapi.com"
staging_url   = "https://signal-staging.dev.uzinvestapi.com"
dev_url       = "https://signal-dev.dev.uzinvestapi.com"
deploy_targets = ["staging", "prod"]
tg_chat       = "404580642"
created_at    = 2026-05-10
# T-0195: per-project test commands for the generated AGENTS.md "## Test
# commands" block (render_agents_md.py). Optional `test_*_cmd` fields — each
# value is the rendered markdown for the command part (carries its own
# backticks/annotations). Absent fields render no line.
#
# T-0724 (2026-08-18): all four values were WRONG and had been since T-0195 —
# they were copied from an AGENTS.md block that was already stale, and the
# on-disk file was then hand-corrected while this config was not. Measured in
# the dev clone: `signal-tracker` is the PROD container and pytest is not in
# the image (`requirements.txt` is the production dependency list), so the old
# backend line could never run; `web/package.json` has NO `test:e2e` and NO
# `lint` script and there is no `eslint.config.*` in `web/`. A render would
# have restored three false claims into the every-turn file. Long-form caveats
# (T-0338 lock, known-red tests, the node:test-not-vitest trap, the
# frontend-unit build gate) deliberately live in AGENT_INSTRUCTIONS.md, per
# AGENTS.md's own "What NOT to put here".
test_backend_cmd       = "`backend/run_tests.sh` (T-0338 — manages its own venv and defaults `DATABASE_URL` to `signal_tracker_dev`; bare `pytest` points at PROD). Caveats: `/home/www/bot-squad/data/watchrobot/AGENT_INSTRUCTIONS.md`."
test_frontend_unit_cmd = "`web/run_tests.sh` (= `npm test` from `web/`; `node:test`, NOT vitest — needs node >= 22.6, the script finds it). Gates the staging image build (T-0677)."
test_e2e_cmd           = "`npm test` from `tests/` (a separate package — there is no `test:e2e` in `web/` and never has been)"
test_typecheck_cmd     = "from `web/`, `npx tsc -b` — `-p tsconfig.json` checks ZERO files and always exits 0 (T-0471)"
test_lint_cmd          = "**not wired up** — no `lint` script and no `eslint.config.*` in `web/`, though the toolchain is in devDependencies (T-0375)"
# T-0199: per-project identity for the generated AGENTS.md (render_agents_md.py).
# All optional — an absent field renders a neutral placeholder / omitted line,
# never another project's identity.
#
# T-0726 (2026-08-18): ops_path is now the ABSOLUTE data dir, not the in-clone
# `ops/bot-squad` symlink. Measured: that symlink exists ONLY in the dev clone
# (untracked, `.gitignore:56`), while `~/watchrobot/master/ops/` and
# `~/watchrobot/deploy/ops/` hold nothing but `.gitignore` — so all 23
# `ops/bot-squad/...` paths in the every-turn file were dead for a session
# doing prod hotfixes in the master clone. It had also been a DANGLING symlink
# (-> `data/signal-tracker`, renamed away by T-0189 on 2026-06-02) for ~2.5
# months with nothing reddening. Planting copies in the other two clones was
# rejected: the deploy clone is force-synced to origin on every staging run, an
# untracked symlink is invisible to git and rots exactly as this one did, and
# `ops/` is a real directory in these clones so `project_scaffold._link_ops`
# skips it by design. The absolute path resolves from every clone and from any
# cwd, and `render_agents_md.py --check-paths` now walks it (T-0726 DoD 2).
ops_path     = "/home/www/bot-squad/data/watchrobot"
stack        = "FastAPI + asyncpg backend, React 19 + Vite + TS + Tailwind frontend, PostgreSQL, Docker + traefik."
stakeholders = "Alexey (chat 404580642, @alexeysdk) and Timofey (@timpo). Equal authority — see the constitution."
tg_bot       = "@watchbot"
# T-0726: where the bot token actually lives. The template used to tell EVERY
# project "token in `.env` / `secrets.toml`"; watchrobot has no `secrets.toml`
# at all (`find -maxdepth 2` — empty). Absent field = the render makes no claim.
tg_token_source = "`TELEGRAM_BOT_TOKEN` in `.env`, read at `backend/config.py:127`"
extra_hard_rules = [
  "Don't read or copy from `/home/www/bot-squad/archived/signal-tracker-old/` — that's the deprecated multi-role flow. Patterns there don't apply.",
  # T-0724: compact restatement of the stakeholder's 2026-08-07 brevity
  # requirement, which lived as a 16-line hand-added section in AGENTS.md and
  # would have been wiped by the first honest render. Full text:
  # AGENT_INSTRUCTIONS.md + ops/bot-squad/ops/brevity.md.
  # T-0724 (ответ оператору p347, замер 2026-08-18): этот пункт стоит здесь
  # ИМЕННО ПОТОМУ, что сторожа на правило нет. test_t0682_docker_layer_order.py
  # знает по имени только `ARG CLAUDE_CODE_VERSION`; `ARG VCS_REF` живёт в нём
  # лишь в докстринге, а WR_LIB_VERSION / WR_LIB_COMMIT / WR_FE_UNIT_GATE не
  # покрыты вовсе — новый ARG выше apt/pip не покраснит НИЧЕГО. Сосед по этому
  # инциденту, T-0454, сюда НЕ добавлен: там гейт отказывает на постановке в
  # очередь (deploy.py compose_env_gaps) и сам называет недостающие переменные.
  "**Новый `ARG` в `Dockerfile` — только НЕПОСРЕДСТВЕННО над своим `RUN` и ниже\n  apt/pip (T-0678).** Объявленный `ARG` входит в ключ кэша КАЖДОГО `RUN` ниже\n  него: `ARG VCS_REF` наверху пересобирал apt и pip на каждом выкате (98-170 с,\n  однажды 1800 с и убитый выкат). Сторож знает по имени только\n  `ARG CLAUDE_CODE_VERSION` — новый ARG он НЕ ловит. Разбор:\n  `/home/www/bot-squad/data/watchrobot/AGENT_INSTRUCTIONS.md`.",
  "**Краткость — требование стейкхолдера (2026-08-07): он платит за длину.**\n  Ему: ответ ПЕРВОЙ строкой, число вместо прилагательного, один закрытый\n  вопрос за раз. Не пересказывать его просьбу и не описывать процесс.\n  Оператору: сделано / чем доказано / осталось — три строки. Полный текст:\n  `/home/www/bot-squad/data/watchrobot/AGENT_INSTRUCTIONS.md`.",
]

[projects.bot-squad]
slug          = "bot-squad"
display_name  = "Bot Squad"
# T-0680 (stakeholder 2026-07-25: "и аналогично с BS" — same for bot-squad):
# short abbreviation used in TG topic names, [<topic_abbrev>] instead of the
# full slug.
topic_abbrev  = "BS"
# Workspace dir: parent of dev/master, where the operator lives. The
# hook resolves the slug for any session run at or under this path.
repo_workspace = "/home/almdudleer/bot-squad"
# Dev clone: editing surface for bot-squad's own code. Branch bot_squad/dev.
repo_path     = "/home/almdudleer/bot-squad/dev"
# Master clone: separate from the installation. Merges land here before
# deploy. The running installation at /home/www/bot-squad is a deploy
# TARGET, not part of the project tree.
repo_master   = "/home/almdudleer/bot-squad/master"
# Deploy clone (T-0143): local CI/CD checkout, parallel to dev/master. The
# deploy worker creates it on first deploy and force-syncs it to
# origin/bot_squad/dev each run, so a dirty dev tree no longer gates deploys —
# the recipe builds from the latest PUSHED commit. No agent ever edits here.
repo_deploy   = "/home/almdudleer/bot-squad/deploy"
deploy_branch = "bot_squad/dev"
master_branch = "master"
prod_url      = "https://botsquad.dev"
# Convention (update-delivery.md): "staging" deploys to THIS server only
# (the mothership); "prod" produces a release artifact downloadable by
# OTHER attached servers. The prod target + artifact pipeline is not
# wired yet — Chapter II of multi-server initiative. Until it lands,
# bot-squad only ships "staging" from this server.
staging_url   = "https://staging.botsquad.dev"
dev_url       = "https://bot-squad.dev.uzinvestapi.com"
# "staging" redeploys THIS install; "prod" (mothership-only, T-0081) cuts
# a versioned release tarball + manifest entry for attached servers to
# pull via the release-feed API (T-0082). Refuses to run unless
# `mothership = true` below.
deploy_targets = ["staging", "prod"]
# Mothership: this install produces bot-squad releases that other attached
# servers consume. The flag is the SSOT for is_mothership() — the consumer
# poller (T-0083) and apply (T-0084) short-circuit when this is true so the
# mothership never tries to consume its own releases. See T-0086.
mothership    = true
# T-0184: opt this project into the drift-check tick (T-0149). The worker is
# multi-project; without this gate the tick nagged dev sessions in EVERY project
# (a signal-tracker dev once got a drift nag for an unrelated ticket). bot-squad
# is the only project that opts in today — others stay off by default.
drift_enforcement = true
tg_chat       = "404580642"
created_at    = 2026-05-14
# T-0195: bot-squad's OWN test commands (was wrongly advertising watchrobot's
# `docker exec signal-tracker` before this was config-driven). Backend = api +
# worker pytest; Build = web build (no e2e yet). No `signal-tracker` leakage.
test_backend_cmd = "`cd api && pytest`, `cd worker && pytest`"
test_build_cmd   = "`cd web && npm run build` (build only — no e2e yet)"
# T-0199: AGENTS.md identity fields. bot-squad's dev clone has NO data-dir
# symlink (its real ops/ holds only bot-squad-bin; the data symlink lives at
# the workspace dir), so ops_path is the absolute install data dir.
ops_path = "/home/www/bot-squad/data/bot-squad"
stack    = "FastAPI API + uvicorn worker (Python), React + Vite + Bootstrap web UI, tmux + per-user unix-socket worker for session orchestration."

