# bot-squad project registry. Add a new project via:
#   scripts/cli/bot-squad project init <slug> --repo <path>

[projects.watchrobot]
slug          = "watchrobot"
display_name  = "Watchrobot"
# T-0189 (stakeholder 2026-06-02, "it's all watchrobot now"): the bot-squad
# project SLUG is now `watchrobot`, matching the public brand (repo, home dir,
# staging domain). This SUPERSEDES the 2026-05-19 decision to keep the slug
# `signal-tracker` while only the home dir carried the brand — the data dir
# moved data/signal-tracker → data/watchrobot and a ~30-day /p/signal-tracker
# redirect covers stale links (App.tsx). The DEPLOY INFRA below is deliberately
# RETAINED as-is: prod/staging/dev URLs (signal-*.dev.uzinvestapi.com) and the
# docker service/container names (signal-tracker-staging in deploy/staging.sh)
# point at watchrobot's real running deployment — renaming those is a separate
# external-infra task, NOT T-0189.
# Dev clone: where agents work. On the deploy_branch (bot_squad/dev), pushes
# to staging on every deploy queue.
repo_path     = "/home/almdudleer/watchrobot/dev"
# Master clone: separate working tree on master branch for prod deploys,
# hotfixes, and rollbacks. The dev clone is never touched for these so the
# agent team can keep working uninterrupted.
repo_master   = "/home/almdudleer/watchrobot/master"
deploy_branch = "bot_squad/dev"
master_branch = "master"
# RETAINED (external infra — see note above): real deployment URLs.
prod_url      = "https://signal-tracker.dev.uzinvestapi.com"
staging_url   = "https://signal-staging.dev.uzinvestapi.com"
dev_url       = "https://signal-dev.dev.uzinvestapi.com"
deploy_targets = ["staging", "prod"]
tg_chat       = "404580642"
created_at    = 2026-05-10

[projects.bot-squad]
slug          = "bot-squad"
display_name  = "Bot Squad"
# Workspace dir: parent of dev/master, where the operator lives. The
# hook resolves the slug for any session run at or under this path.
repo_workspace = "/home/almdudleer/bot-squad"
# Dev clone: editing surface for bot-squad's own code. Branch bot_squad/dev.
repo_path     = "/home/almdudleer/bot-squad/dev"
# Master clone: separate from the installation. Merges land here before
# deploy. The running installation at /home/www/bot-squad is a deploy
# TARGET, not part of the project tree.
repo_master   = "/home/almdudleer/bot-squad/master"
# Deploy clone (T-0143): local CI/CD checkout, parallel to dev/master. The
# deploy worker creates it on first deploy and force-syncs it to
# origin/bot_squad/dev each run, so a dirty dev tree no longer gates deploys —
# the recipe builds from the latest PUSHED commit. No agent ever edits here.
repo_deploy   = "/home/almdudleer/bot-squad/deploy"
deploy_branch = "bot_squad/dev"
master_branch = "master"
prod_url      = "https://botsquad.dev"
# Convention (update-delivery.md): "staging" deploys to THIS server only
# (the mothership); "prod" produces a release artifact downloadable by
# OTHER attached servers. The prod target + artifact pipeline is not
# wired yet — Chapter II of multi-server initiative. Until it lands,
# bot-squad only ships "staging" from this server.
staging_url   = "https://staging.botsquad.dev"
dev_url       = "https://bot-squad.dev.uzinvestapi.com"
# "staging" redeploys THIS install; "prod" (mothership-only, T-0081) cuts
# a versioned release tarball + manifest entry for attached servers to
# pull via the release-feed API (T-0082). Refuses to run unless
# `mothership = true` below.
deploy_targets = ["staging", "prod"]
# Mothership: this install produces bot-squad releases that other attached
# servers consume. The flag is the SSOT for is_mothership() — the consumer
# poller (T-0083) and apply (T-0084) short-circuit when this is true so the
# mothership never tries to consume its own releases. See T-0086.
mothership    = true
# T-0184: opt this project into the drift-check tick (T-0149). The worker is
# multi-project; without this gate the tick nagged dev sessions in EVERY project
# (a signal-tracker dev once got a drift nag for an unrelated ticket). bot-squad
# is the only project that opts in today — others stay off by default.
drift_enforcement = true
tg_chat       = "404580642"
created_at    = 2026-05-14
