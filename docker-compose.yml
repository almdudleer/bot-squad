services:
  bot-squad-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VITE_MOTHERSHIP: ${MOTHERSHIP:-0}
    image: bot-squad-api:latest
    container_name: bot-squad-api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      - CONFIG_DIR=/config
      - DATA_DIR=/data
      - WORKER_SOCK=/data/_sock/worker.sock
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=1
      - BUILD_AT_IMPORT=1
      - CLAUDE_PROJECTS_DIR=/home/almdudleer/.claude/projects
      - MOTHERSHIP=${MOTHERSHIP:-0}
    volumes:
      - ./config:/config:rw
      - ./data:/data:rw
      - /home/almdudleer/.claude/projects:/home/almdudleer/.claude/projects:ro
      # Project repo paths — needed for AGENTS.md read/write through the API.
      # signal-tracker/dev is a symlink → signal_tracker_mgmt; mount both so
      # the symlink resolves inside the container.
      - /home/almdudleer/signal_tracker:/home/almdudleer/signal_tracker:ro
      - /home/almdudleer/signal_tracker_mgmt:/home/almdudleer/signal_tracker_mgmt:rw
    networks:
      - avo_backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=avo_backend"
      # Primary host: the single-install playground.
      - "traefik.http.routers.bot-squad.rule=Host(`bot-squad.${DOMAIN}`)"
      - "traefik.http.routers.bot-squad.entrypoints=websecure"
      - "traefik.http.routers.bot-squad.tls.certresolver=le"
      - "traefik.http.services.bot-squad.loadbalancer.server.port=8000"
      # Mothership staging host (T-0033): served by the same container
      # when MOTHERSHIP=1 in .env. Both hosts hit the same backend; the
      # FE mothership chunks are gated by build flag, not host header.
      # Detach later by removing this router + setting MOTHERSHIP=0.
      - "traefik.http.routers.bot-squad-mothership.rule=Host(`staging.bot-squad.org`)"
      - "traefik.http.routers.bot-squad-mothership.entrypoints=websecure"
      - "traefik.http.routers.bot-squad-mothership.tls.certresolver=le"
      - "traefik.http.routers.bot-squad-mothership.service=bot-squad"

networks:
  avo_backend:
    external: true
