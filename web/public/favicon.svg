<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    bot-squad favicon — mission-control identity.
    Navy panel with an amber accent diamond, a cyan beacon dot, and an
    amber tick mark across the bottom — reads as a status panel at 16px.
  -->
  <!-- panel background, rounded corners -->
  <rect x="1" y="1" width="30" height="30" rx="4" ry="4"
        fill="#0d1825" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- amber diamond (the sidebar's [PROJECT] glyph) -->
  <path d="M 16 7 L 22 16 L 16 25 L 10 16 Z" fill="#fbbf24"/>

  <!-- cyan beacon dot in the centre of the diamond -->
  <circle cx="16" cy="16" r="2" fill="#0d1825"/>
  <circle cx="16" cy="16" r="1" fill="#22d3ee"/>

  <!-- tick mark — thin amber bar along the bottom edge to read as telemetry -->
  <rect x="6" y="27" width="20" height="1" fill="#fbbf24" opacity="0.6"/>
</svg>
