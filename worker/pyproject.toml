[project]
name = "bot-squad-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    # T-0194: [socks] extra pulls in socksio so cfg.tg_proxy_url may be a
    # socks5:// proxy (http(s):// work without it). Used by tg.py + tg_listener.
    "httpx[socks]>=0.27",
    # T-0075: the shared frontmatter parser/writer (bot_squad_worker.frontmatter,
    # mirrored from api/app/frontmatter.py) reads/writes task + session md via
    # pyyaml so block- and inline-style YAML lists parse identically. Replaces
    # the worker's hand-rolled line-based frontmatter readers.
    "pyyaml>=6",
    # T-0179: Fernet at-rest encryption for secrets.toml values. Used by the
    # shared secret_crypto.py (mirrored from api/app/secret_crypto.py) that
    # config.load() calls to decrypt the TG bot token.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# T-0386 / INI-04 Phase 2: optional self-hosted ru/en STT for voice feedback
# intake. Deliberately NOT a core dependency — transcribe.py lazy-imports it
# only when voice intake is actually used, so CI and installs that don't enable
# voice are unaffected (a missing dep degrades gracefully: audio kept + a
# failure-marked artifact). Provision on-host where voice is wanted:
#   pip install -e 'worker[voice]'   # in the worker venv
# then a 1-time model fetch (WhisperModel downloads on first use).
voice = [
    "faster-whisper~=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
