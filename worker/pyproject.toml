[project]
name = "bot-squad-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    # T-0194: [socks] extra pulls in socksio so cfg.tg_proxy_url may be a
    # socks5:// proxy (http(s):// work without it). Used by tg.py + tg_listener.
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
